"$schema" = 'https://starship.rs/config-schema.json'

# ==============================================================================
#  Active Palette & Prompt Layout (Root Settings)
# ==============================================================================
palette = 'tokyo_night'

format = """
[](color_bg1)\
$os\
$username\
$hostname\
$localip\
$shlvl\
$shell\
$sudo\
[](bg:color_bg2 fg:color_bg1)\
$directory\
[](fg:color_bg2 bg:color_bg3)\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
[](fg:color_bg3 bg:color_bg4)\
$package\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$bun\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$xmake\
$zig\
$buf\
[](fg:color_bg4 bg:color_bg5)\
$container\
$docker_context\
$kubernetes\
$singularity\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$direnv\
$mise\
$env_var\
$crystal\
$custom\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$netns\
$vagrant\
[](fg:color_bg5 bg:color_bg6)\
$memory_usage\
$battery\
$jobs\
$time\
$cmd_duration\
$status\
[ ](fg:color_bg6)\
$line_break$character"""

# ==============================================================================
#  Color Palette Configuration
#  Defines the paired semantic colors (fg/bg) for each prompt segment.
# ==============================================================================
[palettes.tokyo_night]
# Segment 1: System, OS & User (Luminous Periwinkle with Dark Tokyo Ink)
color_bg1      = '#a3aed2'
color_fg1      = '#15161e' # Deep Tokyo Ink (Contrast: 9.5:1)

# Segment 2: Directory & Navigation (Tokyo Blue with Dark Tokyo Ink)
color_bg2      = '#769ff0'
color_fg2      = '#15161e' # Deep Tokyo Ink (Contrast: 7.8:1)

# Segment 3: Version Control & VCS (Dark Twilight Slate with Neon Cyan)
color_bg3      = '#394260'
color_fg3      = '#7dcfff' # Tokyo Electric Cyan (Contrast: 7.2:1)

# Segment 4: Programming Languages & Tools (Deep Midnight with Tokyo Sky Blue)
color_bg4      = '#212736'
color_fg4      = '#769ff0' # Tokyo Light Blue (Contrast: 8.5:1)

# Segment 5: Containers, Environments & Cloud (Dark Plum with Radiant Lilac)
color_bg5      = '#2d2042'
color_fg5      = '#bb9af7' # Tokyo Magenta / Lilac (Contrast: 7.8:1)

# Segment 6: Diagnostics, Metrics & Time (Night Dark with Periwinkle Silver)
color_bg6      = '#1d2230'
color_fg6      = '#a0a9cb' # Tokyo Muted Silver (Contrast: 8.4:1)

# Functional Telemetry & Prompt Accents
color_duration = '#e0af68' # Command execution duration accent (Tokyo Warm Gold)
color_error    = '#f7768e' # Command error & failure status accent (Tokyo Vibrant Red)
color_success  = '#769ff0' # Prompt character success symbol (Tokyo Blue)

# ------------------------------------------------------------------------------
# 1. System, User & Host Modules (Segment 1: color_bg1 / color_fg1)
# ------------------------------------------------------------------------------
[os]
disabled = false
style = "bold fg:color_fg1 bg:color_bg1"
format = "[ $symbol]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = "󉰰"
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bold fg:color_fg1 bg:color_bg1"
style_root = "bold fg:color_fg1 bg:color_bg1"
format = "[ $user ]($style)"

[hostname]
ssh_only = true
style = "bold fg:color_fg1 bg:color_bg1"
format = "[@$hostname ]($style)"

[sudo]
disabled = false
style = "bold fg:color_fg1 bg:color_bg1"
format = "[󰌆 ]($style)"

[localip]
ssh_only = true
style = "bold fg:color_fg1 bg:color_bg1"
format = "[󰩟 $localipv4 ]($style)"

[shlvl]
style = "bold fg:color_fg1 bg:color_bg1"
format = "[󱆃 $shlvl ]($style)"

# ------------------------------------------------------------------------------
# 2. Directory Module (Segment 2: color_bg2 / color_fg2)
# ------------------------------------------------------------------------------
[directory]
style = "bold fg:color_fg2 bg:color_bg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ------------------------------------------------------------------------------
# 3. Version Control Modules (Segment 3: color_bg3 / color_fg3)
# ------------------------------------------------------------------------------
[git_branch]
symbol = ""
style = "bold fg:color_fg3 bg:color_bg3"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold fg:color_fg3 bg:color_bg3"
format = '[($all_status$ahead_behind )]($style)'

[git_state]
style = "bold fg:color_fg3 bg:color_bg3"
format = '[($state( $progress_current/$progress_total) )]($style)'

[git_metrics]
added_style = "bold fg:color_fg3 bg:color_bg3"
deleted_style = "bold fg:color_fg3 bg:color_bg3"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[hg_branch]
symbol = ""
style = "bold fg:color_fg3 bg:color_bg3"
format = '[ $symbol $branch ]($style)'

