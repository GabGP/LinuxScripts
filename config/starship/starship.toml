# 6. Diagnostics, System & Time (Segment 6: color_bg6)
# ------------------------------------------------------------------------------
[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = '[[ $symbol $percentage ](bold fg:color_fg0 bg:color_bg6)]'

[memory_usage]
symbol = "󰍛"
style = "bold fg:color_fg0 bg:color_bg6"
format = '[[ $symbol $ram ](bold fg:color_fg0 bg:color_bg6)]($style)'

[jobs]
symbol = "󰜎"
style = "bold fg:color_fg0 bg:color_bg6"
format = '[[ $symbol $number ](bold fg:color_fg0 bg:color_bg6)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bold fg:color_fg0 bg:color_bg6"
format = '[[  $time ](bold fg:color_fg0 bg:color_bg6)]($style)'

[cmd_duration]
min_time = 2_000
style = "bold fg:color_accent bg:color_bg6"
format = '[[ 󱎫 $duration ](bold fg:color_accent bg:color_bg6)]($style)'

[status]
disabled = false
style = "bold fg:color_accent bg:color_bg6"
format = '[[ ✖ $status ](bold fg:color_accent bg:color_bg6)]($style)'

# ------------------------------------------------------------------------------
# 7. Prompt Character
# ------------------------------------------------------------------------------
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_bg6)'
error_symbol = '[](bold fg:color_accent)'
vimcmd_symbol = '[](bold fg:color_bg6)'
