# ------------------------------------------------------------------------------
# 5. Containers, Virtual Environments & Cloud (Segment 5: color_bg5)
# ------------------------------------------------------------------------------
[container]
symbol = "⬢"
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol $name ]($style)'

[docker_context]
symbol = ""
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $context) ]($style)'

[kubernetes]
symbol = "󱃾"
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $context) ]($style)'
disabled = false

[singularity]
symbol = "󰨊"
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $name) ]($style)'

[guix_shell]
symbol = ""
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $name) ]($style)'

[nix_shell]
symbol = ""
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $state) ]($style)'

[conda]
symbol = ""
style = "bold fg:color_fg0 bg:color_bg5"
