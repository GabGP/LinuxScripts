style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $account) ]($style)'

[azure]
symbol = "󰠅"
style = "bold fg:color_fg0 bg:color_bg5"
format = '[ $symbol( $subscription) ]($style)'

# ------------------------------------------------------------------------------
# 6. Diagnostics, System & Time (Segment 6: color_bg6)
# ------------------------------------------------------------------------------
[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
display = [{ threshold = 101, style = "bold fg:color_fg0 bg:color_bg6" }]
format = '[ $symbol $percentage ]($style)'

[memory_usage]
symbol = "󰍛"
style = "bold fg:color_fg0 bg:color_bg6"
format = '[ $symbol $ram ]($style)'

[jobs]
symbol = "󰜎"
style = "bold fg:color_fg0 bg:color_bg6"
format = '[ $symbol $number ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bold fg:color_fg0 bg:color_bg6"
format = '[  $time ]($style)'

[cmd_duration]
min_time = 2_000
style = "bold fg:color_duration bg:color_bg6"
format = '[󱎫 $duration ]($style)'

[status]
disabled = false
style = "bold fg:color_error bg:color_bg6"
format = '[✖ $status ]($style)'

# ------------------------------------------------------------------------------
# 7. Prompt Character
# ------------------------------------------------------------------------------
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_success)'
error_symbol = '[](bold fg:color_error)'
vimcmd_symbol = '[](bold fg:color_success)'
