"$schema" = 'https://starship.rs/config-schema.json'

# ==============================================================================
#  Active Palette & Prompt Layout (Root Settings)
# ==============================================================================
palette = 'kokiri'

format = """
[](color_bg1)\
$os\
$username\
$hostname\
$localip\
$shlvl\
$shell\
$sudo\
[](bg:color_bg2 fg:color_bg1)\
$directory\
[](fg:color_bg2 bg:color_bg3)\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
[](fg:color_bg3 bg:color_bg4)\
$package\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$bun\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$xmake\
$zig\
$buf\
[](fg:color_bg4 bg:color_bg5)\
$container\
$docker_context\
$kubernetes\
$singularity\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$direnv\
$mise\
$env_var\
$crystal\
$custom\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$netns\
$vagrant\
[](fg:color_bg5 bg:color_bg6)\
$memory_usage\
$battery\
$jobs\
$time\
$cmd_duration\
$status\
[ ](fg:color_bg6)\
$line_break$character"""

# ==============================================================================
#  Color Palette Configuration
#  Defines the semantic colors used throughout all prompt segments.
# ==============================================================================
[palettes.kokiri]
color_fg0      = '#1a1005' # Primary text (High-contrast foreground)
color_bg1      = '#b8860b' # Segment 1: System, OS & User
color_bg2      = '#a07838' # Segment 2: Directory & Navigation
color_bg3      = '#4a7a7a' # Segment 3: Version Control & VCS
color_bg4      = '#4a6a8a' # Segment 4: Programming Languages & Tools
color_bg5      = '#7a5a7a' # Segment 5: Containers, Environments & Cloud
color_bg6      = '#4a7a4a' # Segment 6: Diagnostics, Metrics & Time
color_duration = '#a0c080' # Command execution duration accent
color_error    = '#c94f47' # Command error & failure status accent
color_success  = '#4a7a4a' # Prompt character success symbol

# ------------------------------------------------------------------------------
# 1. System, User & Host Modules (Segment 1: color_bg1)
# ------------------------------------------------------------------------------
[os]
disabled = false
style = "bold fg:color_fg0 bg:color_bg1"
format = "[ $symbol]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = "󉰰"
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bold fg:color_fg0 bg:color_bg1"
style_root = "bold fg:color_fg0 bg:color_bg1"
format = "[ $user ]($style)"

[hostname]
ssh_only = true
style = "bold fg:color_fg0 bg:color_bg1"
format = "[@$hostname ]($style)"

[sudo]
disabled = false
style = "bold fg:color_fg0 bg:color_bg1"
format = "[󰌆 ]($style)"

[localip]
ssh_only = true
style = "bold fg:color_fg0 bg:color_bg1"
format = "[󰩟 $localipv4 ]($style)"

[shlvl]
style = "bold fg:color_fg0 bg:color_bg1"
format = "[󱆃 $shlvl ]($style)"

# ------------------------------------------------------------------------------
# 2. Directory Module (Segment 2: color_bg2)
# ------------------------------------------------------------------------------
[directory]
style = "bold fg:color_fg0 bg:color_bg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ------------------------------------------------------------------------------
# 3. Version Control Modules (Segment 3: color_bg3)
# ------------------------------------------------------------------------------
[git_branch]
symbol = ""
style = "bold fg:color_fg0 bg:color_bg3"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold fg:color_fg0 bg:color_bg3"
format = '[($all_status$ahead_behind )]($style)'

[git_state]
style = "bold fg:color_fg0 bg:color_bg3"
format = '[($state( $progress_current/$progress_total) )]($style)'

[git_metrics]
added_style = "bold fg:color_fg0 bg:color_bg3"
deleted_style = "bold fg:color_fg0 bg:color_bg3"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[hg_branch]
symbol = ""
style = "bold fg:color_fg0 bg:color_bg3"
format = '[ $symbol $branch ]($style)'

