# ------------------------------------------------------------------------------
# 5. Containers, Virtual Environments & Cloud (Segment 5: color_bg5 / color_fg5)
# ------------------------------------------------------------------------------
[container]
symbol = "⬢"
style = "bold fg:color_fg5 bg:color_bg5"
format = '[ $symbol $name ]($style)'

[docker_context]
symbol = ""
style = "bold fg:color_fg5 bg:color_bg5"
format = '[ $symbol( $context) ]($style)'

[kubernetes]
symbol = "󱃾"
style = "bold fg:color_fg5 bg:color_bg5"
format = '[ $symbol( $context) ]($style)'
disabled = false

[singularity]
symbol = "󰨊"
style = "bold fg:color_fg5 bg:color_bg5"
format = '[ $symbol( $name) ]($style)'

[guix_shell]
symbol = ""
style = "bold fg:color_fg5 bg:color_bg5"
format = '[ $symbol( $name) ]($style)'

[nix_shell]
symbol = ""
style = "bold fg:color_fg5 bg:color_bg5"
