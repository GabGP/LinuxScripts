# ==============================================================================
#  Kitty Terminal Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Font Configuration
# ------------------------------------------------------------------------------
# Font family: Font name with Nerd Font glyphs (e.g., 'MesloLGS Nerd Font', 'FiraCode Nerd Font', 'Hack')
font_family             MesloLGS Nerd Font

# Bold / Italic font variants: 'auto' (automatic detection) or specific font family name
bold_font               auto
italic_font             auto
bold_italic_font        auto

# Font size in points (e.g., 10.0, 11.0, 12.0, 13.0)
font_size               12.0

# ------------------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Retrowave Dark
include current-theme.conf
# END_KITTY_THEME

# ------------------------------------------------------------------------------
# Window Appearance & Transparency
# ------------------------------------------------------------------------------
# Background opacity: 0.0 (fully transparent) to 1.0 (fully opaque, default: 1.0)
background_opacity      0.25

# Background blur strength behind transparent windows: 0 (disabled) to 64 (Wayland / KWin / macOS)
background_blur         32

# Window padding in points around terminal edges: e.g., 0, 4, 8, 12, 16
window_padding_width    8

# Window title bar and decorations: 'no' (show titlebar), 'yes' (hide titlebar & borders), 'titlebar-only'
hide_window_decorations yes

# Close window confirmation dialog: 0 (never prompt), 1 (prompt if processes running), -1 (always prompt)
confirm_os_window_close 1

# ------------------------------------------------------------------------------
# Cursor Customization
# ------------------------------------------------------------------------------
# Cursor shape: 'beam' (I-beam line), 'block' (solid rectangle), or 'underline'
cursor_shape            beam

# Animated cursor trail: 0 (disabled), or 1-5 (minimum jump distance in cells to trigger trail)
cursor_trail            1

# Cursor trail decay timing: <start_delay_seconds> <duration_seconds> (e.g., 0.1 0.35, 0.05 0.2)
cursor_trail_decay      0.1 0.35

# ------------------------------------------------------------------------------
# Scrollback & History Buffer
# ------------------------------------------------------------------------------
# Number of scrollback lines kept in memory: e.g., 2000 (default), 10000, 50000, -1 (infinite)
scrollback_lines        10000

# Scroll multiplier for mouse wheel: e.g., 1.0, 3.0 (smooth), 5.0 (default)
wheel_scroll_multiplier 3.0

# ------------------------------------------------------------------------------
# Tab Bar (Custom Slanted Powerline + Right Status Widgets)
# ------------------------------------------------------------------------------
# Tab bar placement: 'top' or 'bottom' (default: bottom)
tab_bar_edge            top

# Tab bar visual style: 'custom' (uses ~/.config/kitty/tab_bar.py for live status widgets)
tab_bar_style           custom

# Powerline separator shape: 'slanted', 'angled', 'round'
tab_powerline_style     angled

# Minimum number of tabs to show tab bar: 1 (always visible for status widgets), 2 (only when 2+ tabs)
tab_bar_min_tabs        1

# Font style for active tab: 'bold', 'bold-italic' (default), 'italic', 'normal'
active_tab_font_style   bold

# Font style for inactive tabs: 'normal' (default), 'italic', 'bold'
inactive_tab_font_style normal

# ------------------------------------------------------------------------------
# Mouse & Audio Bell
# ------------------------------------------------------------------------------
# Style of underline applied to URLs on hover: 'curly' (wavy), 'straight', 'double', 'dotted', 'dashed', 'none'
url_style               curly

# Auto-detect URLs under mouse cursor: 'yes' (default) or 'no'
detect_urls             yes

# Audio bell sound on error or tab completion: 'no' (silent / disabled), 'yes' (system alert beep)
enable_audio_bell       yes
