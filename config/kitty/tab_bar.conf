# ==============================================================================
#  Kitty Tab Bar & Right Status Configuration
# ==============================================================================
#  This file configures the Kitty custom tab bar extension.
#  Changes take effect immediately upon hot-reloading with Ctrl + Shift + F5.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Tab Title & Truncation
# ------------------------------------------------------------------------------
# Maximum directory depth to display before truncating (e.g. 3 -> …/dir1/dir2/dir3)
max_title_depth         3

# Automatically detect running CLI programs in $PATH not explicitly listed below
auto_detect_commands    yes

# Default Nerd Font icon used for auto-detected commands without custom icon
default_cmd_icon        

# ------------------------------------------------------------------------------
# 2. Right Status Widgets
# ------------------------------------------------------------------------------
# Active widgets rendered on the right side of the tab bar (ordered left-to-right)
# Available modules: weather, ram, cpu, battery, clock
# (Clock serves as the rightmost anchor and inherits active tab accent styling)
active_widgets          weather ram cpu battery clock

# ------------------------------------------------------------------------------
# 3. Widget Options
# ------------------------------------------------------------------------------
# Clock strftime format string (e.g. %H:%M for 24-hour, %I:%M %p for 12-hour)
clock_format            %H:%M

# Weather cache TTL in seconds (default: 1800 = 30 minutes)
# WARNING: You may get rate limited if the refresh rate is too frequent!
weather_refresh_seconds 1800

# Optional manual GPS coordinates (e.g. 52.5200, 13.4050 for Berlin, overrides automatic GeoIP)
# weather_lat           52.5200
# weather_lon           13.4050

# ------------------------------------------------------------------------------
# 4. Diagnostic Logging
# ------------------------------------------------------------------------------
# Enable timestamped event logging to .cache/tab_bar.log (auto-rotated at 512KB)
enable_logging          no

# ==============================================================================
# 5. Command Icons
# ==============================================================================
# Syntax: cmd_icon <command_name> <nerd_font_glyph>
# Any command mapped here is automatically recognized and formatted in tab titles.

