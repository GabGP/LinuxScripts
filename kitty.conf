# ==============================================================================
#  Kitty Terminal Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Retrowave Dark
include current-theme.conf
# END_KITTY_THEME

# ------------------------------------------------------------------------------
# Window Appearance & Transparency
# ------------------------------------------------------------------------------
# Background opacity (0.0 = fully transparent, 1.0 = fully opaque)
background_opacity 0.25

# Background blur amount behind transparent windows (e.g., KWin / Wayland / macOS)
background_blur    32

# Internal window padding in points (adds breathing room between text and window edges)
window_padding_width 12

# Hide window title bars and borders (leaves window management to the desktop environment)
hide_window_decorations yes

# ------------------------------------------------------------------------------
# Cursor Customization
# ------------------------------------------------------------------------------
# Cursor shape: 'block', 'beam' (I-beam line), or 'underline'
cursor_shape        beam

# Animated cursor trail: minimum movement distance in cells to trigger trail (0 to disable)
cursor_trail        1

# Trail decay timing: <start_delay_seconds> <duration_seconds>
cursor_trail_decay  0.1 0.35
