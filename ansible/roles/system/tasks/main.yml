---
- name: Add user to extra groups
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: "{{ user_groups }}"
    append: true

- name: Read default kernel arguments
  become: true
  ansible.builtin.command: grubby --info=DEFAULT
  register: grubby_info
  check_mode: false
  changed_when: false

- name: Add kernel arguments
  become: true
  ansible.builtin.command: grubby --update-kernel=ALL --args={{ item }}
  loop: "{{ kernel_args }}"
  when: item not in grubby_info.stdout

- name: Set git identity
  community.general.git_config:
    scope: global
    name: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: user.name, value: "{{ git_user_name }}" }
    - { key: user.email, value: "{{ git_user_email }}" }
  when: item.value | length > 0
